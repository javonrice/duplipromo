name: Render Dupli Videos

on:
  push:
    branches:
      - claude/add-remotion-claude-skills-AR7Ve
      - main
  workflow_dispatch:
    inputs:
      composition:
        description: 'Which composition to render'
        required: false
        default: 'DupliPsychology'
        type: choice
        options:
          - DupliPsychology
          - DupliPromo
          - both

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: video/package-lock.json

      - name: Install dependencies
        working-directory: video
        run: npm ci

      - name: Generate voiceover
        working-directory: video
        continue-on-error: true
        run: node scripts/generate-voiceover-psychology.mjs

      - name: Create silent fallback if voiceover missing
        working-directory: video
        run: |
          if [ ! -f "public/voiceover-psychology.mp3" ]; then
            echo "⚠️ Voiceover missing — creating silent placeholder"
            ffmpeg -f lavfi -i anullsrc=r=44100:cl=mono -t 38 -q:a 9 -acodec libmp3lame public/voiceover-psychology.mp3
          else
            echo "✅ Voiceover found"
          fi

      - name: Render DupliPsychology
        if: ${{ github.event.inputs.composition != 'DupliPromo' }}
        working-directory: video
        run: npx remotion render DupliPsychology out/dupli-psychology.mp4

      - name: Render DupliPromo
        if: ${{ github.event.inputs.composition == 'DupliPromo' || github.event.inputs.composition == 'both' }}
        working-directory: video
        run: npx remotion render DupliPromo out/dupli-promo.mp4

      - name: Post Psychology download link
        if: ${{ github.event.inputs.composition != 'DupliPromo' }}
        run: |
          echo "## 🎬 Dupli Psychology Video" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          RESPONSE=$(curl -s --max-time 60 -F "file=@video/out/dupli-psychology.mp4" https://file.io/?expires=14d)
          echo "file.io response: $RESPONSE"
          LINK=$(echo "$RESPONSE" | python3 -c "
import sys, json
try:
    d = json.load(sys.stdin)
    print(d.get('link') or d.get('url') or 'Upload failed - check artifact instead')
except Exception as e:
    print(f'Parse error: {e}')
" 2>&1)
          echo "**Download link:**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "$LINK" >> $GITHUB_STEP_SUMMARY
          echo "📲 DOWNLOAD: $LINK"

      - name: Post Promo download link
        if: ${{ github.event.inputs.composition == 'DupliPromo' || github.event.inputs.composition == 'both' }}
        run: |
          echo "## 🎬 Dupli Promo Video" >> $GITHUB_STEP_SUMMARY
          RESPONSE=$(curl -s --max-time 60 -F "file=@video/out/dupli-promo.mp4" https://file.io/?expires=14d)
          LINK=$(echo "$RESPONSE" | python3 -c "
import sys, json
try:
    d = json.load(sys.stdin)
    print(d.get('link') or d.get('url') or 'Upload failed - check artifact instead')
except Exception as e:
    print(f'Parse error: {e}')
" 2>&1)
          echo "$LINK" >> $GITHUB_STEP_SUMMARY
          echo "📲 PROMO DOWNLOAD: $LINK"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dupli-videos
          path: video/out/*.mp4
          retention-days: 7
