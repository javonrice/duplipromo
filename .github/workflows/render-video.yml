name: Render Dupli Videos

on:
  push:
    branches:
      - claude/add-remotion-claude-skills-AR7Ve
      - main
  workflow_dispatch:
    inputs:
      composition:
        description: 'Which composition to render (leave blank for DossaomiVideo)'
        required: false
        default: 'DupliPsychology'
        type: choice
        options:
          - DupliPsychology
          - DollarTreeHaul
          - DupliPromo
          - both
      # ── Dossami SaaS inputs ──────────────────────────────────────────────
      video_id:
        description: 'Supabase video UUID (Dossami)'
        required: false
        default: ''
      script:
        description: 'User script (Dossami)'
        required: false
        default: ''
      style:
        description: 'Visual style: minimal | bold | cinematic (Dossami)'
        required: false
        default: 'minimal'
      size:
        description: 'Format: 9:16 | 16:9 (Dossami)'
        required: false
        default: '9:16'

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ELEVENLABS_API_KEY:       ${{ secrets.ELEVENLABS_API_KEY }}
      SUPABASE_EDGE_URL:        https://mpemvvakffinptjyrkzg.supabase.co/functions/v1
      DOSSAMI_WEBHOOK_SECRET:   ${{ secrets.DOSSAMI_WEBHOOK_SECRET }}
      GH_TOKEN:                 ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Log trigger inputs
        run: |
          echo "=== Trigger ==="
          echo "event: ${{ github.event_name }}"
          echo "video_id: '${{ github.event.inputs.video_id }}'"
          echo "composition: '${{ github.event.inputs.composition }}'"
          echo "style: '${{ github.event.inputs.style }}'"
          echo "size: '${{ github.event.inputs.size }}'"
          echo "script_len: $(echo '${{ github.event.inputs.script }}' | wc -c) chars"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: video/package-lock.json

      - name: Install dependencies
        working-directory: video
        run: npm ci

      # ════════════════════════════════════════════════════════════════════════
      # DOSSAMI — user-submitted script render
      # Triggered when video_id input is present
      # ════════════════════════════════════════════════════════════════════════

      - name: Mark video as rendering
        if: ${{ github.event.inputs.video_id != '' }}
        run: |
          RESP=$(curl -s -w "\n__HTTP_STATUS__:%{http_code}" -X POST "$SUPABASE_EDGE_URL/complete-render" \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: $DOSSAMI_WEBHOOK_SECRET" \
            -d "{\"video_id\":\"${{ github.event.inputs.video_id }}\",\"status\":\"rendering\"}")
          echo "Response: $RESP"
          HTTP_CODE=$(echo "$RESP" | grep '__HTTP_STATUS__' | cut -d: -f2)
          echo "HTTP status: $HTTP_CODE"
          [ "$HTTP_CODE" = "200" ] || { echo "❌ complete-render returned $HTTP_CODE"; exit 1; }

      - name: Generate Dossami voiceover
        if: ${{ github.event.inputs.video_id != '' }}
        working-directory: video
        continue-on-error: true
        env:
          DOSSAMI_SCRIPT: ${{ github.event.inputs.script }}
          DOSSAMI_STYLE:  ${{ github.event.inputs.style }}
        run: node scripts/generate-voiceover-dossami.mjs

      - name: Silent fallback — Dossami voiceover
        if: ${{ github.event.inputs.video_id != '' }}
        working-directory: video
        run: |
          if [ ! -f "public/voiceover-dossami.mp3" ]; then
            WORDS=$(echo "${{ github.event.inputs.script }}" | wc -w)
            SECS=$(( (WORDS * 60 / 150) + 2 ))
            echo "⚠️ Voiceover failed — creating ${SECS}s silent fallback"
            ffmpeg -f lavfi -i anullsrc=r=44100:cl=mono -t $SECS -q:a 9 -acodec libmp3lame public/voiceover-dossami.mp3
          else
            echo "✅ Dossami voiceover ready"
          fi

      - name: Render DossamiVideo
        if: ${{ github.event.inputs.video_id != '' }}
        working-directory: video
        run: |
          PROPS=$(node -e "
            const s = JSON.stringify({
              script: process.env.SCRIPT,
              style:  process.env.STYLE  || 'minimal',
              size:   process.env.SIZE   || '9:16',
            });
            process.stdout.write(s);
          ")
          npx remotion render DossamiVideo out/dossami.mp4 --props="$PROPS"
        env:
          SCRIPT: ${{ github.event.inputs.script }}
          STYLE:  ${{ github.event.inputs.style }}
          SIZE:   ${{ github.event.inputs.size }}

      - name: Upload video to GitHub Release
        if: ${{ github.event.inputs.video_id != '' }}
        id: upload
        run: |
          VIDEO_ID="${{ github.event.inputs.video_id }}"
          TAG="video-${VIDEO_ID}"

          # Create a release to host the video (idempotent)
          RELEASE=$(curl -s -X POST \
            "https://api.github.com/repos/javonrice/duplipromo/releases" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"Video $VIDEO_ID\",\"draft\":false,\"prerelease\":false}")

          UPLOAD_URL=$(echo "$RELEASE" | python3 -c "import sys,json; print(json.load(sys.stdin)['upload_url'].split('{')[0])" 2>/dev/null)

          if [ -z "$UPLOAD_URL" ]; then
            echo "❌ Could not get upload URL from release"
            echo "$RELEASE"
            exit 1
          fi

          # Upload the MP4
          ASSET=$(curl -s -X POST "${UPLOAD_URL}?name=${VIDEO_ID}.mp4" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: video/mp4" \
            --data-binary @video/out/dossami.mp4)

          VIDEO_URL=$(echo "$ASSET" | python3 -c "import sys,json; print(json.load(sys.stdin)['browser_download_url'])" 2>/dev/null)

          if [ -z "$VIDEO_URL" ]; then
            echo "❌ Upload failed"; echo "$ASSET"; exit 1
          fi

          echo "video_url=$VIDEO_URL" >> $GITHUB_OUTPUT
          echo "✅ Uploaded: $VIDEO_URL"

      - name: Mark video as done
        if: ${{ github.event.inputs.video_id != '' && success() }}
        run: |
          RESP=$(curl -s -w "\n__HTTP_STATUS__:%{http_code}" -X POST "$SUPABASE_EDGE_URL/complete-render" \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: $DOSSAMI_WEBHOOK_SECRET" \
            -d "{\"video_id\":\"${{ github.event.inputs.video_id }}\",\"status\":\"done\",\"video_url\":\"${{ steps.upload.outputs.video_url }}\"}")
          echo "Response: $RESP"
          HTTP_CODE=$(echo "$RESP" | grep '__HTTP_STATUS__' | cut -d: -f2)
          echo "HTTP status: $HTTP_CODE"
          [ "$HTTP_CODE" = "200" ] && echo "✅ Marked done" || echo "⚠️ complete-render returned $HTTP_CODE"

      - name: Mark video as failed
        if: ${{ github.event.inputs.video_id != '' && failure() }}
        run: |
          curl -s -X POST "$SUPABASE_EDGE_URL/complete-render" \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: $DOSSAMI_WEBHOOK_SECRET" \
            -d "{\"video_id\":\"${{ github.event.inputs.video_id }}\",\"status\":\"failed\"}"
          echo "❌ Marked failed"

      # ════════════════════════════════════════════════════════════════════════
      # ORIGINAL COMPOSITIONS
      # ════════════════════════════════════════════════════════════════════════

      - name: Generate psychology voiceover
        if: ${{ github.event.inputs.video_id == '' && (github.event.inputs.composition == 'DupliPsychology' || github.event.inputs.composition == 'both' || github.event.inputs.composition == '') }}
        working-directory: video
        continue-on-error: true
        run: node scripts/generate-voiceover-psychology.mjs

      - name: Silent fallback — psychology
        if: ${{ github.event.inputs.video_id == '' && (github.event.inputs.composition == 'DupliPsychology' || github.event.inputs.composition == 'both' || github.event.inputs.composition == '') }}
        working-directory: video
        run: |
          if [ ! -f "public/voiceover-psychology.mp3" ]; then
            ffmpeg -f lavfi -i anullsrc=r=44100:cl=mono -t 38 -q:a 9 -acodec libmp3lame public/voiceover-psychology.mp3
          fi

      - name: Generate haul voiceover
        if: ${{ github.event.inputs.video_id == '' && (github.event.inputs.composition == 'DollarTreeHaul' || github.event.inputs.composition == 'both') }}
        working-directory: video
        continue-on-error: true
        run: node scripts/generate-voiceover-haul.mjs

      - name: Silent fallback — haul
        if: ${{ github.event.inputs.video_id == '' && (github.event.inputs.composition == 'DollarTreeHaul' || github.event.inputs.composition == 'both') }}
        working-directory: video
        run: |
          if [ ! -f "public/voiceover-haul.mp3" ]; then
            ffmpeg -f lavfi -i anullsrc=r=44100:cl=mono -t 43 -q:a 9 -acodec libmp3lame public/voiceover-haul.mp3
          fi

      - name: Download haul product images
        if: ${{ github.event.inputs.video_id == '' && (github.event.inputs.composition == 'DollarTreeHaul' || github.event.inputs.composition == 'both') }}
        working-directory: video
        run: node scripts/download-haul-images.mjs

      - name: Verify haul images exist
        if: ${{ github.event.inputs.video_id == '' && (github.event.inputs.composition == 'DollarTreeHaul' || github.event.inputs.composition == 'both') }}
        working-directory: video
        run: |
          MISSING=0
          for f in bg-aisle dt-tumbler dt-serum dt-bodywash dt-deodorant brand-stanley brand-serum brand-soldejan brand-native; do
            FILE="public/haul/${f}.jpg"
            if [ ! -f "$FILE" ] || [ ! -s "$FILE" ]; then echo "❌ Missing: $FILE"; MISSING=1
            else echo "✅ $FILE ($(wc -c < "$FILE") bytes)"; fi
          done
          [ "$MISSING" -eq 0 ] || { echo "::error::Haul images missing"; exit 1; }

      - name: Render DupliPsychology
        if: ${{ github.event.inputs.video_id == '' && (github.event.inputs.composition == 'DupliPsychology' || github.event.inputs.composition == 'both' || github.event.inputs.composition == '') }}
        working-directory: video
        run: npx remotion render DupliPsychology out/dupli-psychology.mp4

      - name: Render DollarTreeHaul
        if: ${{ github.event.inputs.video_id == '' && (github.event.inputs.composition == 'DollarTreeHaul' || github.event.inputs.composition == 'both') }}
        working-directory: video
        run: npx remotion render DollarTreeHaul out/dollar-tree-haul.mp4

      - name: Render DupliPromo
        if: ${{ github.event.inputs.video_id == '' && (github.event.inputs.composition == 'DupliPromo' || github.event.inputs.composition == 'both') }}
        working-directory: video
        run: npx remotion render DupliPromo out/dupli-promo.mp4

      - name: Post Psychology download link
        if: ${{ github.event.inputs.video_id == '' && (github.event.inputs.composition == 'DupliPsychology' || github.event.inputs.composition == 'both' || github.event.inputs.composition == '') }}
        continue-on-error: true
        run: |
          echo "## 🎬 Dupli Psychology Video" >> $GITHUB_STEP_SUMMARY
          RESPONSE=$(curl -s --max-time 60 -F "file=@video/out/dupli-psychology.mp4" https://file.io/?expires=14d)
          LINK=$(echo "$RESPONSE" | jq -r '.link // .url // empty' 2>/dev/null)
          [ -n "$LINK" ] && echo "[$LINK]($LINK)" >> $GITHUB_STEP_SUMMARY || echo "⚠️ Use artifact." >> $GITHUB_STEP_SUMMARY

      - name: Post Haul download link
        if: ${{ github.event.inputs.video_id == '' && (github.event.inputs.composition == 'DollarTreeHaul' || github.event.inputs.composition == 'both') }}
        continue-on-error: true
        run: |
          echo "## 🎬 Dollar Tree Haul Video" >> $GITHUB_STEP_SUMMARY
          RESPONSE=$(curl -s --max-time 60 -F "file=@video/out/dollar-tree-haul.mp4" https://file.io/?expires=14d)
          LINK=$(echo "$RESPONSE" | jq -r '.link // .url // empty' 2>/dev/null)
          [ -n "$LINK" ] && echo "[$LINK]($LINK)" >> $GITHUB_STEP_SUMMARY || echo "⚠️ Use artifact." >> $GITHUB_STEP_SUMMARY

      - name: Post Promo download link
        if: ${{ github.event.inputs.video_id == '' && (github.event.inputs.composition == 'DupliPromo' || github.event.inputs.composition == 'both') }}
        continue-on-error: true
        run: |
          echo "## 🎬 Dupli Promo Video" >> $GITHUB_STEP_SUMMARY
          RESPONSE=$(curl -s --max-time 60 -F "file=@video/out/dupli-promo.mp4" https://file.io/?expires=14d)
          LINK=$(echo "$RESPONSE" | jq -r '.link // .url // empty' 2>/dev/null)
          [ -n "$LINK" ] && echo "[$LINK]($LINK)" >> $GITHUB_STEP_SUMMARY || echo "⚠️ Use artifact." >> $GITHUB_STEP_SUMMARY

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dupli-videos
          path: video/out/*.mp4
          retention-days: 7
